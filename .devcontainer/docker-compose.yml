services:

  # Main development container — VS Code attaches here
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      # Mount the project root (one level up from .devcontainer/) into /workspace
      - ../:/workspace:cached
    working_dir: /workspace
    # Keep the container alive; VS Code and postStartCommand manage the actual processes
    command: sleep infinity
    ports:
      - "3000:3000"
    networks:
      - dev

  # Caddy reverse proxy — listens on port 80 and forwards to the app on port 3000
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
    networks:
      - dev

networks:
  dev:
