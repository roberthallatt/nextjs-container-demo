# Setting an explicit project name makes the OrbStack domain predictable:
# caddy.test-nextjs.orb.local → Caddy → app:3000 → Next.js
name: test-nextjs

services:

  # Main development container — VS Code attaches here
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      # Mount the project root (one level up from .devcontainer/) into /workspace
      - ../:/workspace:cached
    working_dir: /workspace
    # Keep the container alive; VS Code and postStartCommand manage the actual processes
    command: sleep infinity
    # Port 3000 is forwarded by VS Code (forwardPorts in devcontainer.json) rather
    # than bound here — avoids conflict with OrbStack which owns host port 3000.
    networks:
      - dev

  # Caddy reverse proxy — listens on port 80 inside the container.
  # No host port binding: OrbStack routes to it automatically via
  # http://caddy.test-nextjs.orb.local
  caddy:
    image: caddy:2-alpine
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
    networks:
      - dev

networks:
  dev:
